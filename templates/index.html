<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Tracker - Spice Garden</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-leaf"></i> Carbon Footprint Tracker</h1>
            <p class="tagline">Spice Garden - Authentic South Indian Cuisine</p>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Menu Section -->
        <section id="menu-section" class="section">
            <h2><i class="fas fa-utensils"></i> Our Menu</h2>
            
            <div class="category-filters">
                <button class="filter-btn active" data-category="all">All Items</button>
                <button class="filter-btn" data-category="Breakfast">Breakfast</button>
                <button class="filter-btn" data-category="Main Course">Main Course</button>
                <button class="filter-btn" data-category="Starter">Starters</button>
                <button class="filter-btn" data-category="veg">Vegetarian</button>
                <button class="filter-btn" data-category="nonveg">Non-Vegetarian</button>
            </div>

            <div class="menu-grid" id="menu-grid">
                <!-- Menu items will be loaded here by JavaScript -->
            </div>
        </section>

        <!-- Order Section -->
        <section id="order-section" class="section">
            <h2><i class="fas fa-shopping-cart"></i> Your Order</h2>
            <div class="order-summary" id="order-summary">
                <p class="empty-order">No items selected yet. Choose items from the menu above.</p>
            </div>
            
            <div class="order-actions">
                <button id="calculate-btn" class="btn btn-primary" disabled>
                    <i class="fas fa-calculator"></i> Calculate Carbon Footprint
                </button>
                <button id="clear-btn" class="btn btn-secondary">
                    <i class="fas fa-trash"></i> Clear Order
                </button>
            </div>
        </section>

        <!-- Results Section (Initially Hidden) -->
        <section id="results-section" class="section hidden">
            <h2><i class="fas fa-chart-bar"></i> Carbon Footprint Analysis</h2>
            <div class="results-container" id="results-container">
                <!-- Results will be displayed here -->
            </div>
        </section>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Calculating your carbon footprint...</p>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Spice Garden. Making sustainable dining choices visible.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
