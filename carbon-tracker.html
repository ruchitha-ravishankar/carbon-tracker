<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Tracker - Spice Garden</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; }
        .header { background: #2d5016; color: white; padding: 2rem; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .content { padding: 2rem; }
        .section { margin-bottom: 2rem; }
        .section h2 { color: #2d5016; margin-bottom: 1rem; border-bottom: 3px solid #4CAF50; padding-bottom: 0.5rem; }
        .category-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1.5rem; }
        .filter-btn { padding: 10px 20px; border: 2px solid #4CAF50; background: white; color: #4CAF50; border-radius: 25px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; }
        .filter-btn:hover, .filter-btn.active { background: #4CAF50; color: white; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .menu-item { border: 2px solid #e0e0e0; border-radius: 10px; padding: 1.5rem; transition: all 0.3s ease; cursor: pointer; }
        .menu-item:hover { border-color: #4CAF50; transform: translateY(-2px); }
        .menu-item.selected { border-color: #4CAF50; background: #f8fff8; }
        .menu-item.vegetarian { border-left: 4px solid #4CAF50; }
        .menu-item.non-vegetarian { border-left: 4px solid #f44336; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .item-name { font-size: 1.2rem; font-weight: 600; color: #2d5016; }
        .item-price { font-size: 1.1rem; font-weight: 700; color: #e91e63; }
        .item-carbon { background: #ffeb3b; padding: 4px 12px; border-radius: 15px; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 0.5rem; }
        .item-description { color: #666; margin-bottom: 1rem; font-style: italic; font-size: 0.9rem; }
        .item-details { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #888; }
        .order-summary { background: #f8f9fa; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; min-height: 100px; }
        .empty-order { text-align: center; color: #666; font-style: italic; }
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e0e0e0; }
        .order-total { margin-top: 1rem; padding-top: 1rem; border-top: 2px solid #4CAF50; font-weight: 700; font-size: 1.2rem; color: #2d5016; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s ease; margin-right: 1rem; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-primary:hover:not(:disabled) { background: #45a049; }
        .btn-primary:disabled { background: #cccccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .results-container { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; border-radius: 15px; display: none; }
        .carbon-rating { text-align: center; margin-bottom: 2rem; }
        .rating-badge { display: inline-block; padding: 15px 30px; background: rgba(255,255,255,0.2); border-radius: 50px; font-size: 1.5rem; font-weight: 700; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 1.5rem; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .footer { background: rgba(0,0,0,0.8); color: white; text-align: center; padding: 2rem; margin-top: 2rem; }
        @media (max-width: 768px) { .menu-grid { grid-template-columns: 1fr; } .category-filters { justify-content: center; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Carbon Footprint Tracker</h1>
            <p class="tagline">Spice Garden - Authentic South Indian Cuisine</p>
        </div>
        <div class="content">
            <section class="section">
                <h2>🍽️ Our Menu</h2>
                <div class="category-filters">
                    <button class="filter-btn active" onclick="filterMenu('all')">All Items</button>
                    <button class="filter-btn" onclick="filterMenu('Breakfast')">Breakfast</button>
                    <button class="filter-btn" onclick="filterMenu('Main Course')">Main Course</button>
                    <button class="filter-btn" onclick="filterMenu('veg')">Vegetarian</button>
                    <button class="filter-btn" onclick="filterMenu('nonveg')">Non-Vegetarian</button>
                </div>
                <div class="menu-grid" id="menu-grid"></div>
            </section>
            <section class="section">
                <h2>🛒 Your Order</h2>
                <div class="order-summary" id="order-summary">
                    <p class="empty-order">No items selected yet. Choose items from the menu above.</p>
                </div>
                <div class="order-actions">
                    <button id="calculate-btn" class="btn btn-primary" onclick="calculateFootprint()" disabled>Calculate Carbon Footprint</button>
                    <button id="clear-btn" class="btn btn-secondary" onclick="clearOrder()">Clear Order</button>
                </div>
            </section>
            <section class="section">
                <h2>📊 Carbon Footprint Analysis</h2>
                <div class="results-container" id="results-container"></div>
            </section>
        </div>
        <div class="footer">
            <p>&copy; 2024 Spice Garden. Making sustainable dining choices visible.</p>
        </div>
    </div>
    <script>
        const menuData = {
            "VD001": { "name": "Masala Dosa", "category": "Breakfast", "price": 120.00, "ingredients": {"rice": 0.15, "lentils": 0.05, "potatoes": 0.1, "onions": 0.05, "spices": 0.02, "oil": 0.03}, "description": "Crispy fermented crepe with spiced potato filling", "is_vegetarian": true },
            "VD002": { "name": "Idli Sambar", "category": "Breakfast", "price": 80.00, "ingredients": {"rice": 0.1, "lentils": 0.08, "vegetables": 0.1, "spices": 0.02, "oil": 0.01}, "description": "Steamed rice cakes with lentil vegetable stew", "is_vegetarian": true },
            "VD003": { "name": "Vegetable Biryani", "category": "Main Course", "price": 150.00, "ingredients": {"rice": 0.25, "vegetables": 0.2, "spices": 0.03, "oil": 0.02, "ghee": 0.01}, "description": "Fragrant rice dish with mixed vegetables", "is_vegetarian": true },
            "NV001": { "name": "Chicken Biryani", "category": "Main Course", "price": 220.00, "ingredients": {"rice": 0.2, "chicken": 0.15, "spices": 0.04, "oil": 0.02, "ghee": 0.01, "yogurt": 0.05}, "description": "Aromatic basmati rice with tender chicken pieces", "is_vegetarian": false },
            "NV002": { "name": "Fish Curry Meals", "category": "Main Course", "price": 180.00, "ingredients": {"rice": 0.15, "fish": 0.2, "coconut": 0.08, "spices": 0.03, "oil": 0.02}, "description": "Traditional fish curry with rice", "is_vegetarian": false },
            "NV003": { "name": "Mutton Sukka", "category": "Main Course", "price": 280.00, "ingredients": {"mutton": 0.25, "coconut": 0.06, "spices": 0.05, "oil": 0.03}, "description": "Dry mutton preparation with coconut", "is_vegetarian": false },
            "NV004": { "name": "Prawn Fry", "category": "Starter", "price": 240.00, "ingredients": {"prawns": 0.2, "spices": 0.03, "oil": 0.02}, "description": "Spicy fried prawns", "is_vegetarian": false },
            "NV005": { "name": "Egg Curry", "category": "Main Course", "price": 130.00, "ingredients": {"eggs": 0.15, "onions": 0.08, "tomatoes": 0.06, "spices": 0.02, "oil": 0.02}, "description": "Boiled eggs in spicy gravy", "is_vegetarian": false }
        };
        const emissionFactors = { "rice": 2.7, "lentils": 0.9, "vegetables": 0.4, "coconut": 0.3, "spices": 1.1, "oil": 3.0, "ghee": 12.0, "chicken": 6.9, "fish": 5.1, "mutton": 24.5, "prawns": 12.0, "eggs": 4.5, "yogurt": 2.4, "potatoes": 0.3, "onions": 0.4, "tomatoes": 0.5 };
        let selectedItems = new Set();
        function initMenu() { renderMenu('all'); }
        function calculateCarbon(ingredients) { let total = 0; for (const [ingredient, quantity] of Object.entries(ingredients)) { if (emissionFactors[ingredient]) total += quantity * emissionFactors[ingredient]; } return total.toFixed(2); }
        function renderMenu(category) {
            const menuGrid = document.getElementById('menu-grid');
            menuGrid.innerHTML = '';
            Object.entries(menuData).forEach(([id, item]) => {
                if (category === 'all' || category === item.category || (category === 'veg' && item.is_vegetarian) || (category === 'nonveg' && !item.is_vegetarian)) {
                    const carbon = calculateCarbon(item.ingredients);
                    const div = document.createElement('div');
                    div.className = `menu-item ${item.is_vegetarian ? 'vegetarian' : 'non-vegetarian'} ${selectedItems.has(id) ? 'selected' : ''}`;
                    div.innerHTML = `<div class="item-header"><div class="item-name">${item.name}</div><div class="item-price">₹${item.price}</div></div><div class="item-carbon">${carbon} kg CO₂</div><p class="item-description">${item.description}</p><div class="item-details"><span>${item.is_vegetarian ? '🌱 Vegetarian' : '🍗 Non-Veg'}</span><span>${item.category}</span></div>`;
                    div.onclick = () => toggleMenuItem(id, div);
                    menuGrid.appendChild(div);
                }
            });
        }
        function filterMenu(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(category);
        }
        function toggleMenuItem(id, element) {
            if (selectedItems.has(id)) { selectedItems.delete(id); element.classList.remove('selected'); } 
            else { selectedItems.add(id); element.classList.add('selected'); }
            updateOrderSummary();
        }
        function updateOrderSummary() {
            const orderSummary = document.getElementById('order-summary');
            const calculateBtn = document.getElementById('calculate-btn');
            if (selectedItems.size === 0) {
                orderSummary.innerHTML = '<p class="empty-order">No items selected yet. Choose items from the menu above.</p>';
                calculateBtn.disabled = true;
                return;
            }
            let totalPrice = 0, totalCarbon = 0, itemsHTML = '';
            selectedItems.forEach(id => {
                const item = menuData[id];
                const carbon = calculateCarbon(item.ingredients);
                totalPrice += item.price;
                totalCarbon += parseFloat(carbon);
                itemsHTML += `<div class="order-item"><span>${item.is_vegetarian ? '🌱' : '🍗'} ${item.name}</span><span>₹${item.price} | ${carbon} kg CO₂</span></div>`;
            });
            orderSummary.innerHTML = itemsHTML + `<div class="order-total"><div>Total: ₹${totalPrice.toFixed(2)} | ${totalCarbon.toFixed(2)} kg CO₂</div></div>`;
            calculateBtn.disabled = false;
        }
        function calculateFootprint() {
            const resultsContainer = document.getElementById('results-container');
            let totalPrice = 0, totalCarbon = 0;
            selectedItems.forEach(id => { const item = menuData[id]; const carbon = calculateCarbon(item.ingredients); totalPrice += item.price; totalCarbon += parseFloat(carbon); });
            const treeMonths = (totalCarbon / 0.5).toFixed(2);
            const kmDriven = (totalCarbon / 0.12).toFixed(2);
            let rating, ratingColor;
            if (totalCarbon < 1.0) { rating = "🌱 LOW CARBON"; ratingColor = "#4CAF50"; }
            else if (totalCarbon < 3.0) { rating = "🟡 MEDIUM CARBON"; ratingColor = "#FF9800"; }
            else { rating = "🔴 HIGH CARBON"; ratingColor = "#f44336"; }
            resultsContainer.innerHTML = `
                <div class="carbon-rating"><div class="rating-badge" style="color: ${ratingColor}">${rating}</div></div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-value">₹${totalPrice.toFixed(2)}</div><div class="stat-label">Total Bill Amount</div></div>
                    <div class="stat-card"><div class="stat-value">${totalCarbon.toFixed(2)} kg</div><div class="stat-label">Carbon Footprint</div></div>
                    <div class="stat-card"><div class="stat-value">${selectedItems.size}</div><div class="stat-label">Items Ordered</div></div>
                </div>
                <div style="background: rgba(255,255,255,0.1); padding: 1.5rem; border-radius: 10px;">
                    <h3 style="text-align: center; margin-bottom: 1rem;">🌳 Environmental Impact</h3>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.2);">
                        <span>Equivalent to planting trees that work for:</span><strong>${treeMonths} months</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                        <span>Or driving a car for:</span><strong>${kmDriven} km</strong>
                    </div>
                </div>
            `;
            resultsContainer.style.display = 'block';
            resultsContainer.scrollIntoView({ behavior: 'smooth' });
        }
        function clearOrder() {
            selectedItems.clear();
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('selected'));
            updateOrderSummary();
            document.getElementById('results-container').style.display = 'none';
        }
        document.addEventListener('DOMContentLoaded', initMenu);
    </script>
</body>
</html>
